<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Meu Site ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
    }

    h1 {
      font-size: 38px;
      color: #ff4d88;
      margin-bottom: 20px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      color: #ddd;
    }

    .heart {
      font-size: 70px;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-block;
      margin-top: 30px;
      padding: 15px 30px;
      border-radius: 30px;
      background: #ff4d88;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <main class="container">
    <div class="heart">❤️</div>

    <h1>Meu Amor</h1>

    <p>
      Um cantinho especial feito com amor,
      carinho e momentos inesquecíveis.
    </p>

    <a class="btn" href="#mensagem">Entrar</a>

    <p id="mensagem" style="margin-top: 40px;">
      Você é uma das partes mais bonitas da minha história. ❤️
    </p>
  </main>

</body>
</html>
